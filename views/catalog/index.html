{{define "content"}}
<section class="section">
  <h2 class="section-title">Catalog</h2>

  <div class="product">
    {{range .Products}}
    <a href="/product/{{.ID}}" class="product-link">
      <div class="product-card">
        <div class="product-image">
          <img src="{{.Image}}" alt="{{.Name}}" />
        </div>

        <div class="product-info">
          <h3>{{.Name}}</h3>
          <p>Rp {{.Price}}</p>
        </div>
      </div>
      {{end}}
    </a>
  </div>
</section>
<footer>
  <div class="footer-content">
    <div>
      <h4>Contact</h4>
      <p>Email: support@myshop.com</p>
      <p>Phone: +62 812 3456 7890</p>
    </div>

    <div>
      <h4>Social Media</h4>
      <p><a href="#">Instagram</a></p>
      <p><a href="http://tiktok.com/jianaka">Tiktok</a></p>
      <p><a href="https://id.shp.ee/LxpFEmG">Shopee</a></p>
    </div>
  </div>

  <div class="footer-bottom">© 2025 Jianaka. All rights reserved.</div>
</footer>

{{end}}
